{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>État du paiement | Garage Teyssier</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="min-h-screen bg-[#111] font-sans text-white">
  <main class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-5 text-center">
    <span class="mb-5 flex h-16 w-16 items-center justify-center rounded-full {% if payment_confirmed %}bg-green-500/15 text-green-400{% else %}bg-amber-500/15 text-amber-400{% endif %}">
      {% if payment_confirmed %}✓{% else %}…{% endif %}
    </span>
    <h1 class="text-2xl font-extrabold">État du paiement</h1>
    <p class="mt-3 text-sm text-gray-300" role="status">{{ message }}</p>
    <a href="{% url 'profile' %}" class="mt-7 bg-[#c12026] px-5 py-3 text-sm font-bold hover:bg-[#9a1a1f]">
      Voir mes commandes
    </a>
  </main>
</body>
</html>
