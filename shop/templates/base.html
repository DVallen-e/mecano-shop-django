{% load static %}

<!DOCTYPE html>
<!-- vezi daca am pus lang ul ok de obicei trebuia sa mai fie ceva dupa fr  -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Teyssier</title>
<!-- inca nu exista acest css, ma gandeam sa punem tailwind -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header>
        <nav>
            <a href="#">Panier</a>
            <a href="#">Connexion</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} shop page</p>
    </footer>
<!-- inca nu exista acest js-->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
